<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billu Rajakumar | Professional Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --dark-color: #212529;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .hero-section {
            padding: 100px 0;
            background: linear-gradient(135deg, #ffffff 0%, #f0f4ff 100%);
        }

        .hero-image-wrapper {
            position: relative;
            padding: 20px;
        }

        .profile-img {
            border: 8px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 100%;
            height: auto;
        }

        .experience-badge {
            position: absolute;
            bottom: 40px;
            right: 0;
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .experience-badge .number {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .experience-badge .text {
            font-size: 0.8rem;
            line-height: 1.2;
        }

        .nav-link {
            font-weight: 500;
            color: var(--dark-color);
            margin: 0 10px;
        }

        .section-padding {
            padding: 80px 0;
        }

        .skill-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #eee;
            transition: transform 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">BR</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#summary">Summary</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Competencies</a></li>
                    <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-5 mb-5 mb-lg-0">
                    <div class="hero-image-wrapper">
                        <img src="./PP copy.jpg" alt="Billu Rajakumar" class="img-fluid rounded-circle profile-img">
                        <div class="experience-badge">
                            <span class="number">12+</span>
                            <span class="text">Years<br>Exp.</span>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="hero-content">
                        <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill mb-3">Available for Hire</span>
                        <h1 class="display-3 fw-bold mb-4">BILLU <span class="text-primary">RAJAKUMAR</span></h1>
                        <p class="lead mb-4 text-secondary">Aspiring Solicitor & Legal Professional</p>
                        <div class="mb-5">
                            <div class="d-flex align-items-center mb-2"><i class="bi bi-geo-alt me-2 text-primary"></i>Relocating to Preston, UK</div>
                            <div class="d-flex align-items-center mb-2"><i class="bi bi-mortarboard me-2 text-primary"></i>BBA.LLB Student</div>
                            <div class="d-flex align-items-center"><i class="bi bi-brush me-2 text-primary"></i>Creative Media Expert</div>
                        </div>
                        <div class="cta-btns">
                            <a href="#contact" class="btn btn-primary btn-lg px-4 me-3">Contact Me</a>
                            <a href="https://drive.google.com/drive/folders/1bkl_zDt8AKuH4wdlgobjJUBu9HBJGHU6" target="_blank" class="btn btn-outline-dark btn-lg px-4">View Portfolio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">© 2025 Billu Rajakumar. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
